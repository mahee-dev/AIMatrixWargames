scenario:
  id: svensk-regeringsbildning-2026
  name: "Regeringsbildningen 2026"
  version: 5
  description: >
    Ett svenskt politiskt Matrix Game som börjar när mandatfördelningen efter
    riksdagsvalet 2026 är fastställd men regeringsfrågan fortfarande är öppen.
    De spelade riksdagspartierna försöker förhandla fram ett trovärdigt
    regeringspaket: statsministerkandidat, regeringsdeltagande, stöd eller
    tolerans, uttryckliga röstpositioner och en rimlig väg till budgetmässig
    regeringsduglighet. Offentliga utgångspositioner är frysta scenariofakta;
    all privat information är uttryckligen fiktiva spelantaganden.

game:
  max_turns: 4
  in_world_turn_length: "48 hours"
  seed: 20260913
  turn_order:
    - s
    - m
    - sd
    - c
    - v
    - kd
    - mp
    - l
  primary_arguments_per_actor: 1
  max_cons_per_actor: 1

actors:
  s:
    name: "Socialdemokraterna"
    public_description: >
      Socialdemokraterna går in i regeringsbildningen med ambitionen att leda
      nästa regering. Inför valet har partiet sagt sig vara berett att samarbeta
      brett men inte med Sverigedemokraterna. En socialdemokratisk
      minoritetsregering med stöd eller tolerans från flera håll är en möjlig väg.
    private_brief: >
      Du företräder Socialdemokraternas förhandlingsledning. Läs mandatresursen
      innan du bedömer vilka kombinationer som faktiskt kan undvika 175 nej.
      Förhandla i första hand om ett komplett regeringspaket, inte bara om vem
      som blir statsminister. Skilj mellan regeringsdeltagande, aktivt stöd och
      tolerans. Ett annat spelat parti är inte bundet förrän det uttryckligen
      har accepterat relevanta villkor. Ett stort avsteg från er offentliga
      linje bör föregås av sondering eller annan trovärdig förankring i
      spelhistoriken.
    objectives:
      - "Få fram en statsministerlösning ledd av Socialdemokraterna."
      - "Håll Sverigedemokraterna utanför regeringen."
      - "Få fram ett regeringspaket som har en trovärdig väg till budget- och sakpolitiskt stöd."
    private_information:
      - "FIKTIVT SPELANTAGANDE: Ni är beredda att överväga en ren S-regering om den är lättare för andra partier att tolerera än en bred koalition."
      - "FIKTIVT SPELANTAGANDE: Ni kan göra betydande sakpolitiska eftergifter för tolerans, men statsministerposten är central."
      - "FIKTIVT SPELANTAGANDE: Ett alltför detaljerat flerpartiavtal riskerar att göra stödpartiernas krav oförenliga; ett smalare paket kan därför vara lättare att hålla ihop."

  m:
    name: "Moderaterna"
    public_description: >
      Moderaterna går in i regeringsbildningen med ambitionen att behålla
      statsministerposten. Inför valet har partiet sagt att det vill bilda en
      regering med samtliga fyra Tidöpartier om mandatunderlaget räcker,
      inklusive Sverigedemokraterna.
    private_brief: >
      Du företräder Moderaternas förhandlingsledning. Läs mandatresursen och
      pröva först om ett M-lett regeringspaket faktiskt kan tolereras. Förhandla
      om regeringsdeltagande, ministerfördelning, sakpolitik, röstpositioner och
      den parlamentariska vägen för budgeten. Andra partiers stöd måste
      uttryckligen accepteras av dem själva. Ett större positionsskifte bör ha
      en synlig förhandlingsväg i spelhistoriken.
    objectives:
      - "Få fram en statsministerlösning ledd av Moderaterna."
      - "Om mandatmatematiken tillåter, bilda en regering med Tidöpartierna."
      - "Säkra ett regeringspaket som kan fungera även efter statsministeromröstningen."
    private_information:
      - "FIKTIVT SPELANTAGANDE: Statsministerposten är ert starkaste enskilda förhandlingsmål."
      - "FIKTIVT SPELANTAGANDE: Om ett fyrpartialternativ inte kan tolereras kan en smalare M-ledd regering med externt stöd vara en fallback."
      - "FIKTIVT SPELANTAGANDE: Ni kan ge stora sakpolitiska eftergifter inom ett M-lett underlag om paketet förblir sammanhållet."

  sd:
    name: "Sverigedemokraterna"
    public_description: >
      Sverigedemokraterna har inför valet sagt att partiet efter valet antingen
      ska ingå i regeringen eller gå i opposition. Partiet har inte velat dra
      generella röda linjer mot samarbete med andra partier och ser ett förnyat
      Tidösamarbete som en naturlig grund om mandatmatematiken räcker.
    private_brief: >
      Du företräder Sverigedemokraternas förhandlingsledning. Läs mandatresursen
      och bedöm om era mandat är nödvändiga för något realistiskt regeringspaket.
      Förhandla om regeringsdeltagande, konkret sakpolitiskt inflytande och
      uttryckliga röstpositioner. Ett erbjudande är inte ett avtal förrän alla
      berörda parter uttryckligen har accepterat det.
    objectives:
      - "Säkra regeringsdeltagande om era mandat är nödvändiga för ett högerunderlag."
      - "Undvik en lösning där partiet ställs utanför samtidigt som dess parlamentariska tyngd tas för given."
      - "Säkra tydligt inflytande över prioriterade profilfrågor i ett eventuellt regeringspaket."
    private_information:
      - "FIKTIVT SPELANTAGANDE: Ett rent stödpartiarrangemang utan ministerposter är betydligt mindre attraktivt än regeringsdeltagande."
      - "FIKTIVT SPELANTAGANDE: Om regeringsdeltagande inte går att nå är tydlig opposition en fullt acceptabel fallback."

  c:
    name: "Centerpartiet"
    public_description: >
      Centerpartiet har inför valet förespråkat ett mittenalternativ och sagt nej
      till både Vänsterpartiet och Sverigedemokraterna i regering. Partiet har
      pekat ut en möjlig regering med S, C, KD och MP.
    private_brief: >
      Du företräder Centerpartiets förhandlingsledning. Läs mandatresursen och
      skilj noggrant mellan att ingå i regeringen, aktivt stöd och att tolerera
      en regering genom avstående. Försök bygga ett fungerande paket där
      statsministerfråga, regeringsdeltagande, reformer och budgetstöd hänger
      ihop. Ett offentligt huvudställningstagande kan ändras, men ett stort
      skifte behöver en trovärdig förhandlingsväg.
    objectives:
      - "Bidra till en stabil regering där varken Vänsterpartiet eller Sverigedemokraterna ingår."
      - "Pröva i första hand ett mittenalternativ om mandatmatematiken gör det möjligt."
      - "Säkra ett konkret reform- och budgetinflytande i den lösning som tolereras."
    private_information:
      - "FIKTIVT SPELANTAGANDE: Att bryta det offentliga nejet till V eller SD i regering skulle ha ett mycket högt trovärdighetspris."
      - "FIKTIVT SPELANTAGANDE: Tolerans av en smalare regering kan vara mer attraktiv än formellt regeringsdeltagande om reformpaketet är tillräckligt tydligt."
      - "FIKTIVT SPELANTAGANDE: Ni vill undvika ett paket där ni förväntas bära ansvar utan verifierbart sakpolitiskt utbyte."
      - "FIKTIVT SPELANTAGANDE: Partiets mandat ger förhandlingsledningen rätt att godkänna tolerans av en smal regering, men regeringsdeltagande kräver först en synlig uppgörelse om företagande och decentralisering."

  v:
    name: "Vänsterpartiet"
    public_description: >
      Vänsterpartiet har inför valet krävt ministerposter om partiets mandat
      behövs för att släppa fram en S-ledd regering. Partiet vill bryta med
      Tidöpolitiken och driver bland annat välfärd, bostäder och ekonomisk
      omfördelning.
    private_brief: >
      Du företräder Vänsterpartiets förhandlingsledning. Läs mandatresursen och
      avgör om era mandat faktiskt behövs för att undvika 175 nej mot en
      S-ledd kandidat. Förhandla inte bara om ministerposter utan om ett paket
      med regeringsform, sakpolitik, budget och uttrycklig röstposition. Andra
      partiers stöd får inte antas utan deras acceptans.
    objectives:
      - "Om era mandat behövs för en S-ledd regering: säkra ett starkt och synligt inflytande över regeringslösningen."
      - "Förhindra ett fortsatt Tidölett eller annat tydligt högerlett regeringsalternativ."
      - "Säkra tydliga eftergifter kring välfärd, bostäder, jämlikhet och minskad vinstjakt."
    private_information:
      - "FIKTIVT SPELANTAGANDE: Om era mandat är avgörande är ett stöd utan regeringsdeltagande eller motsvarande mycket stort inflytande svårt att försvara."
      - "FIKTIVT SPELANTAGANDE: Exakt ministerportfölj är förhandlingsbar om det samlade paketet ger tydligt inflytande."
      - "FIKTIVT SPELANTAGANDE: Om era mandat enkelt kan kringgås är opposition bättre än ett symboliskt avtal."

  kd:
    name: "Kristdemokraterna"
    public_description: >
      Kristdemokraterna går till val på fortsatt samarbete med de andra
      Tidöpartierna och har sagt nej till Vänsterpartiet i regering. Samtidigt
      har partiledningen öppnat för samarbete med Socialdemokraterna i ett
      exceptionellt parlamentariskt läge.
    private_brief: >
      Du företräder Kristdemokraternas förhandlingsledning. Läs mandatresursen
      och pröva först om ett Tidöbaserat regeringspaket kan fungera. Om inte,
      får du undersöka andra lösningar utan att behandla dem som accepterade
      innan motparterna faktiskt sagt ja. Förhandla om både regeringsform och
      konkreta sakpolitiska/budgetmässiga vinster.
    objectives:
      - "Pröva i första hand en regering byggd på Tidöpartierna."
      - "Håll Vänsterpartiet utanför regeringen."
      - "Använd en eventuell vågmästarposition för att säkra tydligt inflytande i ett fungerande regeringspaket."
    private_information:
      - "FIKTIVT SPELANTAGANDE: Ett blocköverskridande samarbete är försvarbart endast om inget stabilt förstahandsalternativ kan bildas."
      - "FIKTIVT SPELANTAGANDE: Om ni blir matematiskt avgörande kan ett tydligt sakpolitiskt utbyte väga tyngre än exakt regeringsform."
      - "FIKTIVT SPELANTAGANDE: Om inget sammanhållet förstahandsalternativ finns vid slutet av Turn 3 föredrar partiledningen ett blocköverskridande reservpaket framför fortsatt låsning."

  mp:
    name: "Miljöpartiet"
    public_description: >
      Miljöpartiet prioriterar klimat, natur, jämlikhet och välfärd. Inför valet
      har partiet sagt att det inte vill se L, M, KD eller SD i regering.
    private_brief: >
      Du företräder Miljöpartiets förhandlingsledning. Läs mandatresursen och
      skilj mellan regeringsdeltagande, aktivt stöd och tolerans. Förhandla om
      ett sammanhållet paket där klimatåtaganden, regeringsform, röstposition
      och budgetmässig trovärdighet hänger ihop. Ett stort avsteg från den
      offentliga regeringslinjen behöver en trovärdig väg i spelhistoriken.
    objectives:
      - "Säkra bindande framsteg i klimat- och miljöpolitiken i den regeringslösning som möjliggörs."
      - "Förhindra att L, M, KD eller SD ingår i regeringen."
      - "Maximera Miljöpartiets inflytande över klimat, natur och en rättvis omställning."
    private_information:
      - "FIKTIVT SPELANTAGANDE: Ett paket utan minst en tydlig och synlig klimatpolitisk vinst är svårare att försvara än att stå utanför."
      - "FIKTIVT SPELANTAGANDE: En smalare regering kan tolereras om klimatåtagandena är tillräckligt konkreta och trovärdiga."

  l:
    name: "Liberalerna"
    public_description: >
      Liberalerna går till val som en del av Tidösamarbetet. Under 2026 har
      partiet accepterat att Sverigedemokraterna kan ingå i en framtida regering
      och nått en gemensam sakpolitisk överenskommelse med SD på flera områden.
      Partiets starkaste profilfråga är skolan.
    private_brief: >
      Du företräder Liberalernas förhandlingsledning. Läs mandatresursen och
      försök omvandla era mandat till ett regeringspaket med tydliga liberala
      profilvinster, en försvarbar regeringsform och en realistisk väg genom
      statsminister- och budgetfrågorna. Andra partiers deltagande eller stöd
      måste uttryckligen accepteras av dem.
    objectives:
      - "Pröva i första hand en regering med de fyra Tidöpartierna om mandatmatematiken räcker."
      - "Säkra tydliga reformer för skola, liberal rättsstat, ekonomi och europeiskt samarbete."
      - "Säkra en regeringslösning som kan försvaras även efter den formella statsministeromröstningen."
    private_information:
      - "FIKTIVT SPELANTAGANDE: Synliga liberala profilvinster är nödvändiga för att motivera stora kompromisser."
      - "FIKTIVT SPELANTAGANDE: Regeringsformen är mer förhandlingsbar än ett paket där centrala profilfrågor lämnas utan tydligt resultat."
      - "FIKTIVT SPELANTAGANDE: Ni vill undvika att göra ett slutligt åtagande innan hela paketet, inklusive budgetvägen, är begripligt."
      - "FIKTIVT SPELANTAGANDE: Ett slutligt JA eller regeringsåtagande kräver en offentligt synlig skolreform som kan tillskrivas Liberalerna innan åtagandet görs."

starting_effects:
  - description: >
      Det slutliga mandatutfallet efter riksdagsvalet 2026 är fastställt.
      Resursen "Valresultat 2026 - mandat" är scenariots enda auktoritativa
      källa för mandatfördelningen. Alla beräkningar av parlamentariskt stöd
      ska utgå från den resursen.
    visibility: public

  - description: >
      Som uttryckligt fiktivt procedurantagande för spelet har den sittande
      statsministern avgått. Regeringen sitter kvar som övergångsregering och
      talmannen har inlett sonderingar men ännu inte lagt fram sitt första
      statsministerförslag.
    visibility: public

  - description: >
      Sverige använder negativ parlamentarism. Ett statsministerförslag
      förkastas om minst 175 av riksdagens 349 ledamöter röstar nej.
      Det krävs inte 175 ja-röster.
    visibility: public

  - description: >
      Ett partis rösthållning är JA, NEJ, AVSTÅR eller OKÄND.
      Tystnad och uteblivet besked är OKÄND och får inte räknas som avstående.
    visibility: public

  - description: >
      Ett spelat parti kan bara binda sig självt. Flerpartsavtal,
      regeringsdeltagande, stöd, tolerans och röstlöften kräver uttrycklig
      acceptans från de berörda spelade parterna i spelhistoriken.
    visibility: public

  - description: >
      Ett trovärdigt slutligt regeringspaket bör ange:
      statsministerkandidat; vilka partier som ska ingå i regeringen;
      vilka övriga partier som aktivt stödjer eller tolererar lösningen;
      deras uttryckliga röstpositioner; centrala sakpolitiska eftergifter;
      samt en rimlig väg till budgetmässig regeringsduglighet.
    visibility: public

  - description: >
      För scenariots syfte kräver en trovärdig budgetväg inte en färdig
      statsbudget. Den kräver minst: vilka partier som avser stödja eller inte
      fälla regeringens första budget; en gemensamt accepterad övergripande
      finanspolitisk ram; samt att inga aktiva Effects innehåller oförenliga
      budgetåtaganden. En ensidig utsaga från ett parti etablerar inte en
      gemensam budgetväg.
    visibility: public

  - description: >
      Ett flerpartspaket är en härledd status. Ett enskilt partis Argument kan
      etablera partiets egna åtaganden men kan inte i sig etablera andra
      partiers deltagande, röster eller godkännande. Paketet är låst först när
      en namngiven statsministerkandidat, varje regeringsparts egen acceptans,
      relevanta JA/NEJ/AVSTÅR-positioner, åberopat stöd eller tolerans och en
      trovärdig budgetväg var för sig finns i aktiva Effects.
    visibility: public

  - description: >
      Ett partis besked att det för närvarande går i opposition eller avstår
      från att lägga fram en statsministerkandidat binder partiets egen aktuella
      hållning. Det etablerar inte att andra regeringsalternativ är omöjliga;
      sådana slutsatser följer endast av aktiva åtaganden och mandatmatematik.
    visibility: public

  - description: >
      Ett stort avsteg från en offentlig huvudposition är möjligt men ska inte
      uppstå som ett oförklarat hopp. Det bör föregås av sondering, erbjudanden
      eller annan trovärdig förankring i spelhistoriken innan det blir ett
      slutligt bindande åtagande.
    visibility: public

  - description: >
      När samtliga relevanta röstpositioner för en namngiven
      statsministerkandidat är uttryckligt kända är själva 175-nej-testet
      deterministiskt. Det ska inte behandlas som en probabilistisk politisk
      bedömning. AMAW-spelet producerar förhandlingsläget; den formella
      mandatmatematiken följer de kända rösterna.
    visibility: public

  - description: >
      Tidiga åtaganden kan bli bindande om de uttryckligen görs, men stora
      flerpartsuppgörelser kräver en trovärdig förhandlingshistorik. Senare
      turns ger inte något parti större rätt att binda andra Actors. Spelet är
      inte en prognos över verklig regeringsbildning.
    visibility: public

