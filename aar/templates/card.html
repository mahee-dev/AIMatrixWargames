<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, height=675">
<title>AMAW after-action card</title>
<style>
/* A fixed dark card: it is exported as an image, so it does not follow the viewer's theme.
   Colours are the dataviz reference dark steps; Actor hues are categorical slots in fixed order,
   outcome uses the status pair and always carries a ✓/✗ glyph. Base styles are the END state of
   every animation, so `body.final` (animations off) is the scorecard frame. */
:root {
  --page: #0d0d0d; --surface: #1a1a19; --raised: #232322;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --base: #383835; --ring: rgba(255,255,255,0.10);
  --good: #0ca30c; --critical: #d03b3b;
  --a0: #3987e5; --a1: #d95926; --a2: #199e70; --a3: #c98500;
  --a4: #d55181; --a5: #008300; --a6: #9085e9; --a7: #e66767; --a-none: #898781;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 675px; overflow: hidden; background: var(--page); color: var(--ink); }
.card { position: absolute; inset: 20px; background: var(--surface); border-radius: 20px;
        box-shadow: inset 0 0 0 1px var(--ring); overflow: hidden; }
.kicker { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

header { position: absolute; left: 36px; right: 36px; top: 28px; }
header h1 { font-size: clamp(26px, 3.4vw, 40px); line-height: 1.15; margin-top: 6px; font-weight: 750; }
header .meta { margin-top: 6px; font-size: 16px; color: var(--ink-2); }

.board { position: absolute; left: 36px; top: 160px; width: 720px; height: 410px; }
.board .row { display: grid; align-items: center; border-bottom: 1px solid var(--grid); }
.board .row.head { border-bottom: 1px solid var(--base); height: 26px; }
.board .row.head div { font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; }
.who { display: grid; grid-template-columns: 12px 1fr; column-gap: 10px; align-items: center; padding-right: 12px; min-width: 0; }
.chip { width: 12px; height: 12px; border-radius: 6px; grid-row: span 2; }
.who .name { font-size: 16px; font-weight: 650; }
.who .model { font-size: 12px; color: var(--muted); }
.cell { display: flex; flex-direction: column; gap: 6px; padding: 0 6px; justify-content: center; min-width: 0; }
.gauge { display: flex; align-items: center; gap: 6px; height: 18px; }
.track { position: relative; flex: 1; height: 8px; border-radius: 4px; background: var(--grid); }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; transform-origin: left center; }
.tick { position: absolute; top: -5px; width: 2px; height: 18px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.auto { flex: 1; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; text-align: center; }
.mark { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mark .pct { color: var(--ink-2); font-weight: 500; margin-right: 3px; }
.ok { color: var(--good); } .no { color: var(--critical); } .undecided { color: var(--muted); }
.dense .pct { display: none; }
.legend { position: absolute; left: 0; bottom: 0; font-size: 12px; color: var(--muted); }
.legend .swatch { display: inline-block; width: 22px; height: 8px; border-radius: 4px; background: var(--ink-2); vertical-align: middle; margin-right: 6px; }
.legend .bar-tick { display: inline-block; width: 2px; height: 14px; background: var(--ink); vertical-align: middle; margin: 0 6px 0 14px; }

aside { position: absolute; left: 790px; right: 36px; top: 160px; }
.highlight { background: var(--raised); border-radius: 14px; padding: 18px 20px; box-shadow: inset 0 0 0 1px var(--ring); }
.highlight .hero { font-size: 56px; font-weight: 780; line-height: 1.05; margin-top: 6px; }
.highlight .line { font-size: 15px; font-weight: 600; margin-top: 4px; }
.highlight .outcome { font-size: 15px; font-weight: 700; margin-top: 2px; }
.highlight .action { font-size: 13px; color: var(--ink-2); margin-top: 6px; line-height: 1.35;
                     display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tallies { margin-top: 18px; }
.tallies .kicker { margin-bottom: 6px; }
.tally { display: grid; grid-template-columns: 12px 1fr auto; column-gap: 10px; align-items: center;
         height: 30px; border-bottom: 1px solid var(--grid); font-size: 14px; }
.tally .score { font-variant-numeric: tabular-nums; font-weight: 700; }
.tally .score span + span { margin-left: 10px; }

footer { position: absolute; left: 36px; right: 36px; bottom: 22px; height: 22px; font-size: 13px; color: var(--muted); }
footer .brand b { color: var(--ink); font-weight: 700; letter-spacing: 0.04em; }
.ticker { position: absolute; left: 0; right: 0; top: 0; opacity: 0; font-size: 14px; color: var(--ink-2); }
.ticker b { color: var(--ink); }

.intro { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
         padding: 0 72px; background: var(--surface); opacity: 0; pointer-events: none; }
.intro h2 { font-size: clamp(36px, 5vw, 60px); font-weight: 800; line-height: 1.1; margin-top: 10px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.intro .meta { font-size: 20px; color: var(--ink-2); margin-top: 14px; }

@keyframes introOut { 0%, 78% { opacity: 1; } 100% { opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes slideIn { from { opacity: 0; transform: translateX(-24px); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes drop { from { opacity: 0; transform: translateY(-14px); } }
@keyframes stamp { from { opacity: 0; transform: scale(1.9); } }
@keyframes pop { from { opacity: 0; transform: translateY(16px) scale(0.96); } }
@keyframes flash { 0% { opacity: 0; } 12%, 88% { opacity: 1; } 100% { opacity: 0; } }
.anim { animation-fill-mode: both; animation-timing-function: cubic-bezier(.2,.7,.2,1); }
body.final * { animation: none !important; }
</style>
</head>
<body>
<div class="card">
  <header class="anim">
    <div class="kicker">After-action report · AMAW</div>
    <h1 class="ellipsis" id="title"></h1>
    <div class="meta" id="meta"></div>
  </header>
  <section class="board" id="board"></section>
  <aside>
    <div class="highlight anim" id="highlight"></div>
    <div class="tallies" id="tallies"><div class="kicker">Arguments granted ✓ · failed ✗</div></div>
  </aside>
  <footer id="footer">
    <div class="brand anim" id="brand"><b>AMAW</b> · Matrix Games played by AI agents</div>
  </footer>
  <div class="intro anim" id="intro">
    <div class="kicker">After-action report</div>
    <h2 id="intro-title"></h2>
    <div class="meta" id="intro-meta"></div>
  </div>
</div>
<script type="application/json" id="aar-data">/*AAR_DATA*/null</script>
<script>
(function () {
  "use strict";
  // Timeline in seconds (design §3.4). Everything is a CSS animation with a fixed delay, so the
  // capture can seek any frame through document.getAnimations().
  var T = { introEnd: 1.6, header: 1.4, rows: 1.6, board: 3.5, boardSpan: 5.2,
            highlight: 9.0, tallies: 10.5, brand: 9.0 };
  var data = JSON.parse(document.getElementById("aar-data").textContent);
  if (!data) return;

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }
  function animate(node, name, delay, duration) {
    node.classList.add("anim");
    node.style.animationName = name;
    node.style.animationDelay = delay.toFixed(3) + "s";
    node.style.animationDuration = duration.toFixed(3) + "s";
    return node;
  }
  function colour(actor) { return actor && actor.slot !== null ? "var(--a" + actor.slot + ")" : "var(--a-none)"; }
  function pct(p) { return Math.round(p * 100) + "%"; }
  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  var actors = {};
  data.actors.forEach(function (a) { actors[a.id] = a; });
  var meta = plural(data.turns, "turn") + " · " + plural(data.actors.length, "Actor") +
             " · " + plural(data.rulings.length, "Argument");

  document.getElementById("title").textContent = data.title;
  document.getElementById("meta").textContent = meta + (data.seed !== null ? " · seed " + data.seed : "");
  document.getElementById("intro-title").textContent = data.title;
  document.getElementById("intro-meta").textContent = meta;
  animate(document.getElementById("intro"), "introOut", 0, T.introEnd);
  animate(document.querySelector("header"), "fadeIn", T.header, 0.5);

  // --- Board: one row per Actor, one column per turn ---------------------------------------
  var board = document.getElementById("board");
  var turns = Math.max(data.turns, 1);
  var columns = "200px repeat(" + turns + ", minmax(0, 1fr))";
  if (turns > 8) board.classList.add("dense");
  var rowHeight = Math.min(88, Math.floor((410 - 26 - 30) / Math.max(data.actors.length, 1)));

  var head = el("div", "row head");
  head.style.gridTemplateColumns = columns;
  head.appendChild(el("div"));
  for (var t = 1; t <= turns; t++) head.appendChild(el("div", null, "T" + t));
  board.appendChild(animate(head, "fadeIn", T.rows, 0.4));

  var cells = {};
  data.actors.forEach(function (a, i) {
    var row = el("div", "row");
    row.style.gridTemplateColumns = columns;
    row.style.height = rowHeight + "px";
    var who = el("div", "who");
    var chip = el("span", "chip");
    chip.style.background = colour(a);
    who.appendChild(chip);
    who.appendChild(el("div", "name ellipsis", a.name));
    who.appendChild(el("div", "model ellipsis", a.model));
    row.appendChild(who);
    for (var t = 1; t <= turns; t++) {
      var cell = el("div", "cell");
      cells[a.id + ":" + t] = cell;
      row.appendChild(cell);
    }
    board.appendChild(animate(row, "slideIn", T.rows + i * 0.3, 0.5));
  });

  var n = Math.max(data.rulings.length, 1);
  var slot = T.boardSpan / n;
  var footer = document.getElementById("footer");
  data.rulings.forEach(function (r, i) {
    var cell = cells[r.actor_id + ":" + r.turn];
    if (!cell) return;
    var at = T.board + i * slot;
    var gauge = animate(el("div", "gauge"), "fadeIn", at, Math.min(0.2, slot));
    var outcome = r.success === true ? "ok" : r.success === false ? "no" : "undecided";
    var glyph = r.success === true ? "✓" : r.success === false ? "✗" : "–";
    if (r.mode === "probabilistic" && r.probability !== null) {
      var track = el("div", "track");
      var fill = el("div", "fill");
      fill.style.width = (r.probability * 100).toFixed(1) + "%";
      fill.style.background = colour(actors[r.actor_id]);
      track.appendChild(animate(fill, "grow", at, Math.max(0.25, slot)));
      if (r.roll !== null) {
        var tick = el("div", "tick");
        tick.style.left = (r.roll * 100).toFixed(1) + "%";
        track.appendChild(animate(tick, "drop", at + 0.15, 0.3));
      }
      gauge.appendChild(track);
      var mark = el("span", "mark " + outcome);
      mark.appendChild(el("span", "pct", pct(r.probability)));
      mark.appendChild(document.createTextNode(glyph));
      gauge.appendChild(animate(mark, "stamp", at + 0.25, 0.3));
    } else {
      gauge.appendChild(el("span", "auto", "no roll"));
      gauge.appendChild(animate(el("span", "mark " + outcome, glyph), "stamp", at + 0.15, 0.3));
    }
    cell.appendChild(gauge);

    var ticker = el("div", "ticker ellipsis");
    ticker.appendChild(el("b", null, "T" + r.turn + " · " + (actors[r.actor_id] || { name: r.actor_id }).name + ": "));
    ticker.appendChild(document.createTextNode(r.action + "  "));
    ticker.appendChild(el("span", outcome,
      r.success === true ? "✓ granted" : r.success === false ? "✗ failed" : "undecided"));
    footer.appendChild(animate(ticker, "flash", at, slot));
  });
  animate(document.getElementById("brand"), "fadeIn", T.brand, 0.5);

  var legend = el("div", "legend");
  legend.appendChild(el("span", "swatch"));
  legend.appendChild(document.createTextNode("the Umpire's odds"));
  legend.appendChild(el("span", "bar-tick"));
  legend.appendChild(document.createTextNode("the server's dice roll · "));
  legend.appendChild(el("span", "ok", "✓ granted"));
  legend.appendChild(document.createTextNode(" "));
  legend.appendChild(el("span", "no", "✗ failed"));
  board.appendChild(animate(legend, "fadeIn", T.board - 0.4, 0.4));

  // --- Highlight ---------------------------------------------------------------------------
  var box = document.getElementById("highlight");
  var h = data.highlight;
  if (h) {
    var who = (actors[h.actor_id] || { name: h.actor_id }).name + " · turn " + h.turn;
    var kinds = {
      long_shot: ["Long shot", pct(h.probability) + " odds", ["outcome ok", "✓ And it worked."]],
      bust: ["Sure thing, busted", pct(h.probability) + " odds", ["outcome no", "✗ And it failed."]],
      most_contested: ["Most contested", plural(h.cons, "Con"), null]
    };
    var k = kinds[h.kind];
    box.appendChild(el("div", "kicker", k[0]));
    box.appendChild(el("div", "hero", k[1]));
    box.appendChild(el("div", "line ellipsis", who));
    if (k[2]) box.appendChild(el("div", k[2][0], k[2][1]));
    box.appendChild(el("div", "action", h.action));
  } else {
    box.appendChild(el("div", "kicker", "Arguments"));
    box.appendChild(el("div", "hero", String(data.rulings.length)));
    box.appendChild(el("div", "line", plural(data.turns, "turn") + " of play"));
  }
  animate(box, "pop", T.highlight, 0.6);

  // --- Tallies -----------------------------------------------------------------------------
  var tallies = document.getElementById("tallies");
  var shown = data.tallies.slice(0, 8);
  shown.forEach(function (row, i) {
    var a = actors[row.actor_id] || { name: row.actor_id, slot: null };
    var line = el("div", "tally");
    var chip = el("span", "chip");
    chip.style.background = colour(a);
    line.appendChild(chip);
    line.appendChild(el("span", "ellipsis", a.name));
    var score = el("span", "score");
    score.appendChild(el("span", "ok", row.granted + " ✓"));
    score.appendChild(el("span", "no", row.failed + " ✗"));
    line.appendChild(score);
    tallies.appendChild(animate(line, "fadeIn", T.tallies + i * 0.12, 0.4));
  });
  animate(tallies.querySelector(".kicker"), "fadeIn", T.tallies, 0.4);
})();
</script>
</body>
</html>
