scenario:
  id: northern-strait
  version: 1
  name: Northern Strait
  description: >
    A contest over the Northern Strait. Arkania, the large power on its coast, has circulated
    a draft charter that would put transit scheduling in Arkanian hands and charge the ships
    that use it. Belvar, a distant power with security commitments in the region, has a naval
    task group on station outside the Strait and wants a durable foothold before its mandate
    runs out. Cestia, the small state between them, lives on grain exports through the Strait
    and on a coalition that will not tolerate foreign soldiers on its soil. Each turn is one
    week; positions taken persist.

game:
  max_turns: 6
  in_world_turn_length: "1 week"
  seed: 424242

  turn_order:
    - arkania
    - belvar
    - cestia

  primary_arguments_per_actor: 1
  max_cons_per_actor: 3

actors:
  arkania:
    name: Republic of Arkania
    public_description: >
      A large regional power bordering the Northern Strait.
    private_brief: >
      You are the political leadership of Arkania. The Strait is your coast and your
      economy runs on the shipping that passes through it. You want the transit regime in
      Arkanian hands and paid for by the ships that use it, and domestic nationalists expect
      you to deliver both. A direct war with Belvar would ruin the shipping you depend on.
    objectives:
      - "Establish Arkanian authority over transit scheduling in the Northern Strait."
      - "Fund that authority through transit fees on non-Arkanian shipping."
      - "Avoid direct armed conflict with Belvar."
    private_information:
      - "Reserve mobilisation requires two turns."
      - "Your intelligence assesses Belvar's domestic support for a prolonged deployment as weak."

  belvar:
    name: Belvar
    public_description: >
      A distant but powerful state with regional security commitments.
    private_brief: >
      You are the political leadership of Belvar. Your partners in the region expect you to
      stop Arkania from taking control of the Strait, and a foothold that outlasts this crisis
      would make that guarantee credible without a permanent fleet. You cannot sustain an
      open-ended deployment.
    objectives:
      - "Prevent any Arkanian authority over transit in the Northern Strait."
      - "Secure a standing naval access agreement at a Cestian port."
      - "Avoid an open-ended deployment."
    private_information:
      - "Domestic support for a prolonged deployment is limited; the mandate lapses after turn 4 unless renewed."
      - "Cestia's finance ministry has quietly asked whether Belvar would underwrite the grain route's insurance."

  cestia:
    name: Cestia
    public_description: >
      A smaller regional state economically linked to both powers.
    private_brief: >
      You are the government of Cestia. Grain exports through the Strait are the economy, and
      your coalition holds together on one promise: no foreign soldiers on Cestian soil. Both
      powers want something from you, and you cannot afford to become their battlefield.
    objectives:
      - "Keep Cestian territory free of any foreign military presence."
      - "Secure toll-free passage for Cestian-flagged shipping through the Northern Strait."
      - "Preserve the coalition government."
    private_information:
      - "The coalition government is politically fragile; a foreign basing agreement would collapse it."
      - "Arkania's scheduling proposal has quiet support among Cestian shipowners if Cestian vessels are exempt from fees."

starting_effects:
  - description: "Commercial shipping continues normally."
    visibility: public
  - description: "Regional political tensions are elevated."
    visibility: public
  - description: "Arkania has circulated a draft Strait Transit Authority charter naming itself as scheduling lead."
    visibility: public
  - description: "A Belvar naval task group is on station outside the Strait; its mandate is under review."
    visibility: public
  - description: "Arkania's reserve mobilisation plan is incomplete."
    visibility: private
    visible_to:
      - arkania
    expires_turn: 3

resources:
  - id: background
    name: Regional Background
    type: background
    path: resources/background.md
    visibility: public
    tags: [history, politics]

  - id: trade
    name: Regional Trade Data
    type: dataset
    path: resources/trade.csv
    visibility: public
    tags: [trade, economy]

  - id: arkania-intel
    name: Arkanian Intelligence Estimate
    type: intelligence
    path: resources/arkania-intel.md
    visibility: private
    visible_to:
      - arkania
    tags: [intelligence, belvar]
